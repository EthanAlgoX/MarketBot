# Modified for marketbot on 2026-10-13; see MODIFICATIONS.md.
# Images-only install: configure MARKETBOT_IMAGE and MARKETBOT_COMPUTER_IMAGE
# with your own registry image names. This project has no published image channel.
# With preloaded images, use install-images.sh --offline to avoid all pulls.
name: marketbot

services:
  postgres:
    # Optional Hub override; unset keeps the digest-pinned official image.
    image: ${POSTGRES_IMAGE:-postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 2g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marketbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-marketbot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketbot} -d ${POSTGRES_DB:-marketbot}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Pull-only stub so `compose up` fetches the published desktop image without a checkout.
  computer:
    image: ${MARKETBOT_COMPUTER_IMAGE:?Set MARKETBOT_COMPUTER_IMAGE to your registry image}:${MARKETBOT_COMPUTER_IMAGE_TAG:-local}
    command: ["true"]
    network_mode: none
    restart: "no"

  data-init:
    # Optional Hub override; unset keeps busybox:1.
    image: ${BUSYBOX_IMAGE:-busybox:1}
    command: ["chown", "-R", "1000:1000", "/data"]
    network_mode: none
    restart: "no"
    volumes:
      - appdata:/data

  # Runs from the app image. Not published as its own image and not exposed on the host:
  # access to the supervisor is equivalent to control of the Docker host.
  supervisor:
    image: ${MARKETBOT_IMAGE:?Set MARKETBOT_IMAGE to your registry image}:${MARKETBOT_IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["pnpm", "--filter", "@marketbot/sandbox-supervisor", "start"]
    init: true
    user: root
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      SUPERVISOR_HOST: "0.0.0.0"
      SUPERVISOR_PORT: "7091"
      DOCKER_SOCKET: /var/run/docker.sock
      MARKETBOT_COMPUTER_IMAGE: ${MARKETBOT_COMPUTER_IMAGE:?Set MARKETBOT_COMPUTER_IMAGE to your registry image}:${MARKETBOT_COMPUTER_IMAGE_TAG:-local}
      MARKETBOT_COMPUTER_MEMORY: ${MARKETBOT_COMPUTER_MEMORY:-2g}
      MARKETBOT_COMPUTER_CPUS: ${MARKETBOT_COMPUTER_CPUS:-2}
      MARKETBOT_COMPUTER_PIDS_LIMIT: ${MARKETBOT_COMPUTER_PIDS_LIMIT:-2048}
      SANDBOX_COMMAND_TIMEOUT_MS: ${SANDBOX_COMMAND_TIMEOUT_MS:-300000}
      SANDBOX_SUPERVISOR_TOKEN: ${SANDBOX_SUPERVISOR_TOKEN:?Set SANDBOX_SUPERVISOR_TOKEN in .env}
      SANDBOX_SCREEN_NETWORK: isolated
      SANDBOX_COMPUTER_EGRESS: ${SANDBOX_COMPUTER_EGRESS:-open}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-}
      AXIOM_TOKEN: ${AXIOM_TOKEN:-}
      AXIOM_DATASET: ${AXIOM_DATASET:-}
      AXIOM_EDGE: ${AXIOM_EDGE:-}
      AXIOM_EDGE_URL: ${AXIOM_EDGE_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - appdata:/data
    networks:
      - app
    depends_on:
      computer:
        condition: service_completed_successfully
      data-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:7091/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    image: ${MARKETBOT_IMAGE:?Set MARKETBOT_IMAGE to your registry image}:${MARKETBOT_IMAGE_TAG:-local}
    restart: unless-stopped
    command:
      - bash
      - -lc
      - pnpm --filter @marketbot/db exec prisma migrate deploy && pnpm --filter @marketbot/api start
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 1536m
    env_file:
      - .env
    environment:
      SECRET_STORE: ${SECRET_STORE:-encrypted}
      INFISICAL_URL: ${INFISICAL_URL:-}
      INFISICAL_ALLOW_INSECURE_HTTP: ${INFISICAL_ALLOW_INSECURE_HTTP:-false}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-}
      INFISICAL_FOLDER: ${INFISICAL_FOLDER:-}
      NODE_ENV: production
      API_HOST: "0.0.0.0"
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-SSO}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_ALLOW_SIGNUP_BYPASS: ${OIDC_ALLOW_SIGNUP_BYPASS:-false}
      AUTH_PASSWORD_ENABLED: ${AUTH_PASSWORD_ENABLED:-true}
      MARKETBOT_DESKTOP_STACK_TOKEN: ${MARKETBOT_DESKTOP_STACK_TOKEN:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://127.0.0.1:5173}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:5173}
      API_URL: ${API_URL:-http://127.0.0.1:5173}
      DATABASE_URL: postgres://${POSTGRES_USER:-marketbot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-marketbot}
      DATA_DIR: /data
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-docker}
      CLOUD_AGENT_PROVIDER: ${CLOUD_AGENT_PROVIDER:-none}
      CLOUD_AGENT_SPACE_ID: ${CLOUD_AGENT_SPACE_ID:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      WAKEUP_DRIVER: graphile
      AGENT_RUNTIME: pi
      # Optional egress proxy (Mainland / corporate). Empty = unset; either case works.
      HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
      HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
      NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
      http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
      https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
      no_proxy: ${no_proxy:-${NO_PROXY:-}}
    ports:
      - "127.0.0.1:${MARKETBOT_API_PORT:-3100}:3100"
    volumes:
      - appdata:/data
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
      supervisor:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    image: ${MARKETBOT_IMAGE:?Set MARKETBOT_IMAGE to your registry image}:${MARKETBOT_IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["pnpm", "--filter", "@marketbot/worker", "start"]
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 2g
    env_file:
      - .env
    environment:
      SECRET_STORE: ${SECRET_STORE:-encrypted}
      INFISICAL_URL: ${INFISICAL_URL:-}
      INFISICAL_ALLOW_INSECURE_HTTP: ${INFISICAL_ALLOW_INSECURE_HTTP:-false}
      INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:-}
      INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-}
      INFISICAL_FOLDER: ${INFISICAL_FOLDER:-}
      BETTER_AUTH_SECRET: ""
      OIDC_ISSUER: ""
      OIDC_CLIENT_ID: ""
      OIDC_CLIENT_SECRET: ""
      AUTH_PASSWORD_ENABLED: "true"
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-marketbot}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-marketbot}
      DATA_DIR: /data
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-docker}
      CLOUD_AGENT_PROVIDER: ${CLOUD_AGENT_PROVIDER:-none}
      CLOUD_AGENT_SPACE_ID: ${CLOUD_AGENT_SPACE_ID:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      SANDBOX_SUPERVISOR_URL: http://supervisor:7091
      SCREEN_PROXY_SECRET: ""
      WAKEUP_DRIVER: graphile
      AGENT_RUNTIME: pi
      # Optional egress proxy (Mainland / corporate). Empty = unset; either case works.
      HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
      HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
      NO_PROXY: ${NO_PROXY:-${no_proxy:-}}
      http_proxy: ${http_proxy:-${HTTP_PROXY:-}}
      https_proxy: ${https_proxy:-${HTTPS_PROXY:-}}
      no_proxy: ${no_proxy:-${NO_PROXY:-}}
    volumes:
      - appdata:/data
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
      data-init:
        condition: service_completed_successfully
      supervisor:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    image: ${MARKETBOT_IMAGE:?Set MARKETBOT_IMAGE to your registry image}:${MARKETBOT_IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["pnpm", "--filter", "@marketbot/web", "preview", "--host", "0.0.0.0", "--port", "5173"]
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    environment:
      NODE_ENV: production
      API_PROXY_TARGET: http://api:3100
      MARKETBOT_HOST: ${MARKETBOT_HOST:-localhost}
      # Set only by the packaged desktop app. Its authenticated probe prevents a
      # source dev server on the same host port from impersonating this stack.
      MARKETBOT_DESKTOP_STACK_TOKEN: ${MARKETBOT_DESKTOP_STACK_TOKEN:-}
      MARKETBOT_IMAGE_TAG: ${MARKETBOT_IMAGE_TAG:-local}
      SCREEN_PROXY_SECRET: ${SCREEN_PROXY_SECRET:?Set SCREEN_PROXY_SECRET in .env}
    ports:
      - "127.0.0.1:${MARKETBOT_WEB_PORT:-5173}:5173"
    networks:
      - app
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  appdata:

networks:
  app:
  data:
    internal: true
