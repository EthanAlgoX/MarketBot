# Modified for marketbot on 2026-10-13; see MODIFICATIONS.md.
appId: com.marketbot.app
name: Compose
---
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      MARKETBOT_ACTIVE_EMAIL: ${MARKETBOT_SCREENSHOT_EMAIL}
- openLink: "marketbot:///new"
- extendedWaitUntil:
    visible: "Name this bot"
    timeout: 15000
- takeScreenshot: 01-new-bot
- tapOn: "Cancel"
- openLink: "marketbot:///new-space"
- extendedWaitUntil:
    visible: "Customer support|Create space"
    timeout: 15000
- takeScreenshot: 02-new-space
- tapOn: "Cancel"
- openLink: "marketbot:///new-group"
- extendedWaitUntil:
    visible: "Name this group"
    timeout: 15000
- takeScreenshot: 03-new-group
- openLink: "marketbot:///"
