name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - name: Install project and development dependencies
        run: uv sync --extra dev
      - name: Lint Python implementation and tests
        run: uv run ruff check marketbot tests scripts/evaluate_finance.py scripts/report_pytest_ci.py
      - name: Test complete Python suite
        run: uv run pytest -q --junitxml=.tmp/pytest-results.xml
      - name: Publish test results and failure annotations
        if: always()
        run: uv run python scripts/report_pytest_ci.py .tmp/pytest-results.xml
      - name: Evaluate financial workflows
        run: uv run python scripts/evaluate_finance.py
      - name: Build distributions
        run: uv build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan for credentials
        run: |
          python -m pip install detect-secrets==1.5.0
          git ls-files -z | xargs -0 detect-secrets-hook --no-verify --baseline .secrets.baseline
