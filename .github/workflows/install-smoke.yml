name: Install Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Build and install the wheel in a fresh environment
        run: |
          mkdir -p marketbot/.xiaohongshu-cli
          python -c "from pathlib import Path; Path('marketbot/.xiaohongshu-cli/cookies.json').write_text('{\"web_session\":\"packaging-test-fixture\"}')"
          uv build
          uv venv /tmp/marketbot-install
          uv pip install --python /tmp/marketbot-install/bin/python dist/*.whl
      - name: Verify installed CLI, finance server, and bundled skills
        working-directory: /tmp
        run: |
          /tmp/marketbot-install/bin/marketbot --help
          /tmp/marketbot-install/bin/marketbot finance --help
          /tmp/marketbot-install/bin/python -m marketbot.mcp.finance --help
          /tmp/marketbot-install/bin/python -c "from importlib.resources import files; from marketbot.rl.env.market_env import LocalMarketEnv; assert files('marketbot').joinpath('skills/finance-mcp/SKILL.md').is_file(); assert files('marketbot').joinpath('skills/portfolio-analyzer/SKILL.md').is_file(); assert not files('marketbot').joinpath('.xiaohongshu-cli/cookies.json').is_file()"
